
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAIS - Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login-page">

    <main class="login-container">

        <!-- Panel Login -->
        <section class="login-left">

            <h1>WELCOME TO CAIS</h1>

            <p class="login-description">
                or use your username and password
            </p>

            <div id="login-alert" class="login-alert" role="alert"></div>

            <form id="form-login" novalidate>

                <div class="login-group">
                    <input
                        type="text"
                        id="username"
                        placeholder="Username"
                        autocomplete="username"
                        required>
                </div>

                <div class="login-group">
                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required>
                </div>

                <div class="password-options">
                    <label>
                        <input type="checkbox" id="show-password">
                        Tampilkan password
                    </label>
                </div>

                <a href="#" class="forgot-password">
                    Lupa Password?
                </a>

                <button type="submit" class="login-btn">
                    SIGN IN
                </button>

            </form>

            <p class="login-hint">
                Akun demo: admin / admin123
            </p>

        </section>

        <!-- Panel Informasi -->
        <section class="login-right">

            <div class="right-content">

                <h2>Hello, Friend!</h2>

                <p>
                    Selamat datang di CAIS.
                    Collaborative Academic Information System
                    untuk mendukung kegiatan akademik.
                </p>

                <a href="../index.html" class="signup-btn">
                    KEMBALI
                </a>

            </div>

        </section>

    </main>

    <script src="../js/login.js"></script>

</body>
</html>
